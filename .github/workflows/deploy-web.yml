name: Deploy Web

# Builds apps/web and publishes it to Cloudflare Workers: the static SPA plus the
# edge Worker that proxies /api/info (attaching the bearer secret), echoes
# /api/headers, and fronts the Umami script/collect endpoints. The custom domain
# (ip.mlz.no) and the workers.dev lockdown are reconciled from wrangler.jsonc on
# every deploy.
#
# Only runs when the web app, the shared wire types, or the root manifests change
# — an API-only change won't redeploy the frontend.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   — token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  — the account the Worker lives in
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

# Least privilege: the deploy only reads the repo; auth to Cloudflare is via the
# API token, not the workflow token.
permissions:
  contents: read

# Never let two web deploys race; an in-flight deploy finishes rather than
# shipping a half-uploaded asset set.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://ip.mlz.no
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The workspace `deploy` script is `vite build && wrangler deploy`, run
      # from apps/web — the same command used locally, so CI ships exactly what a
      # local deploy would. wrangler reads the token/account from the env below.
      - name: Build and deploy
        run: bun run --filter @ip-speil/web deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
