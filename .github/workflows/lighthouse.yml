name: Lighthouse

# Frontend quality gate: build the Worker (apps/web), preview it with the real
# Cloudflare runtime (workerd) via `vite preview`, and run Lighthouse against
# `/`. Accessibility and best-practices are hard gates; performance and SEO
# are warnings (CI timing is noisier than a real browser). The previewed page
# still calls the live production API (api.ip.mlz.no) for /api/info — there's
# no local API in this workflow.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "package.json"
      - "bun.lock"
      - "lighthouserc.json"
      - ".github/workflows/lighthouse.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "package.json"
      - "bun.lock"
      - "lighthouserc.json"
      - ".github/workflows/lighthouse.yml"

# Least privilege: read the repo; results are uploaded as a run artifact.
permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse audit (/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web app
        run: bun run build

      # `vite preview` runs the built Worker in workerd via @cloudflare/vite-plugin
      # (not a static file server), so this exercises the real CSP/content-negotiation
      # behavior the same way `wrangler deploy` would.
      - name: Start preview server
        run: |
          nohup bun run --filter @ip-speil/web preview -- --port 4173 --strictPort > server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 20); do
            status="$(curl -fsS -o /dev/null -w '%{http_code}' http://localhost:4173/ || true)"
            if [ "$status" = "200" ]; then
              echo "Server healthy after ${i} attempt(s)."
              exit 0
            fi
            echo "Attempt ${i}: not ready yet (status=${status:-none}), retrying in 1s..."
            sleep 1
          done
          echo "::error::Server never became healthy — logs follow:"
          cat server.log
          exit 1

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

      - name: Stop server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true
