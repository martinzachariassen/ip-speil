[tools]
bun = "1.3"

# Thin wrappers over the root package.json scripts so `mise run <task>` works too.
[tasks.dev-api]
description = "Run the API (Railway) dev server with watch"
run = "bun run dev:api"

[tasks.dev-web]
description = "Run the web app (Cloudflare Worker + static) via wrangler dev"
run = "bun run dev:web"

[tasks.build]
description = "Bundle the client TypeScript to apps/web/public/assets/js"
run = "bun run build"

[tasks.typecheck]
description = "Strict TypeScript typecheck across all workspaces"
run = "bun run typecheck"

[tasks.lint]
description = "Lint + format check with Biome"
run = "bun run lint"

[tasks.test]
description = "Run the test suite"
run = "bun test"

[tasks.check]
description = "Build, typecheck, lint, and test (run before finishing)"
run = "bun run check"
